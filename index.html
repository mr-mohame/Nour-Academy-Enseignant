<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nour Academy — Espace enseignant</title>

    <!-- Polices : Newsreader (titres) + Inter (texte) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS v4 via CDN (temporaire : à remplacer par Vite + npm) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        /* ---------- 1. Charte graphique ---------- */
    @theme {
      --font-sans: "Inter", system-ui, sans-serif;
      --font-serif: "Newsreader", Georgia, serif;

      --color-paper: #f7f5f0;       /* fond de page        */
      --color-card: #ffffff;        /* cartes              */
      --color-line: #e4e0d6;        /* bordures            */
      --color-ink: #1f1e1b;         /* texte principal     */
      --color-muted: #6b6860;       /* texte secondaire    */
      --color-brand: #1f6f5c;       /* couleur Nour        */
      --color-brand-soft: #e3efe9;
      --color-alert: #b4472e;       /* erreur / alerte     */
      --color-alert-soft: #fbece6;
      --color-ok: #2f7d4f;          /* succès              */
    }

    /* ---------- 2. États ajoutés / retirés par JavaScript (classList) ---------- */
    .erreur input   { border-color: var(--color-alert); }
    .erreur .message { color: var(--color-alert); }
    .valide input   { border-color: var(--color-ok); }
    .valide .message { color: var(--color-ok); }
    .alerte         { border-color: var(--color-alert); background-color: var(--color-alert-soft); }
  </style>
</head>

<body class="bg-paper font-sans text-ink antialiased md:flex md:h-dvh md:flex-col">

    <script src="assets/js/data.js"></script>
    <script src="assets/js/script.js"></script>
</body>

</html>
